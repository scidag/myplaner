server:
  port: 8080
spring:
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/myplanner?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    # Spring AI 1.1.0 新增：用顶级属性启用模型自动配置
    # 改用 openai 模型自动配置，因为百炼工作区域名只支持 OpenAI 兼容端点
    model:
      chat: openai
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
      # 百炼的 OpenAI 兼容端点 base-url，工作区域名 + /compatible-mode
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: qwen3.7-plus
          temperature: 0.7

# Reactor Netty 超时配置，避免 SSL 握手或网络问题导致流式调用卡死
reactor:
  netty:
    response-timeout: 30s
    connect-timeout: 10000

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

myplanner:
  jwt:
    # 仅供本地开发，生产环境必须通过环境变量 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:local-dev-only-secret-please-override-in-production-env}
    expiration: 86400000
