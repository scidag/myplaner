server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/myplanner?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 4096

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

myplanner:
  jwt:
    # 仅供本地开发，生产环境必须通过环境变量 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:local-dev-only-secret-please-override-in-production-env}
    expiration: 86400000
